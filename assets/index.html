<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alpine Roasters · Campaign Planner</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237a3f1d'/%3E%3Ctext x='16' y='21.5' font-family='system-ui,sans-serif' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3EAR%3C/text%3E%3C/svg%3E">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/campaigns/1">
      <span class="mark" aria-hidden="true">AR</span>
      <span class="brand-name">
        <strong>Alpine Roasters</strong>
        <small>Shop admin</small>
      </span>
    </a>

    <nav id="nav" aria-label="Sections">
      <p class="nav-group">Marketing</p>
      <div id="campaign-links"></div>
      <a href="#/campaigns/new" data-page="new-campaign" class="nav-quiet">
        <span class="nav-label"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>New campaign</span>
      </a>

      <p class="nav-group">Shop</p>
      <a href="#/customers" data-page="customers">
        <span class="nav-label"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13c.5-2.3 2.2-3.6 4.2-3.6s3.7 1.3 4.2 3.6"/><path d="M10.6 3.4a2.2 2.2 0 0 1 0 4.2M12 9.6c1.2.4 2 1.6 2.3 3.4"/></svg>Customers</span>
        <span class="count" data-count="customers"></span>
      </a>
      <a href="#/orders" data-page="orders">
        <span class="nav-label"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.8h9v12.4l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1z"/><path d="M5.8 5.2h4.4M5.8 8h4.4"/></svg>Orders</span>
        <span class="count" data-count="orders"></span>
      </a>
      <a href="#/coupons" data-page="coupons">
        <span class="nav-label"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4.5h12.4v2.1a1.5 1.5 0 0 0 0 2.8v2.1H1.8V9.4a1.5 1.5 0 0 0 0-2.8z"/><path d="M6.2 4.8v6.4" stroke-dasharray="1.2 1.2"/></svg>Coupons</span>
        <span class="count" data-count="coupons"></span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="demo-badge">Demo data</span>
      <p>Every customer is made up. No coupon leaves this app.</p>
    </div>
  </aside>

  <main id="main" class="content" tabindex="-1">
    <p class="loading">Loading the shop…</p>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
