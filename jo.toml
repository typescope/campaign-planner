# Jo's compatibility line omits patch versions; use Jo 0.13.5 or later.
jo = "0.13"

[pinning]
harpe = "0.10.1"
harpe-caps = "0.10.1"
harpe-testing = "0.10.1"

[module.agent]
kind = "app"
platform = "python"
enable-ffi = true
src = ["src/"]
depth = 2

packages = [{ name = "harpe", version = "0.10" }]

links = [
  { from = "jo.main", to = "campaign.planner.main" },
]

# Compiles guest programs against a copy of the sandbox and runs them against a
# seeded shop, so it exercises the boundary itself. No API key and no network.
[module.tests]
kind = "app"
platform = "python"
enable-ffi = true
src = ["tests/", "src/"]
depth = 2

packages = [
  { name = "harpe", version = "0.10" },
  { name = "harpe-testing", version = "0.10" },
]

links = [
  { from = "jo.main", to = "campaign.planner.tests.Main.main" },
]

[commands]
start = "jo build --spec sandbox/jo.toml guest && jo run agent"
test = "jo build --spec sandbox/jo.toml guest && jo run tests"
